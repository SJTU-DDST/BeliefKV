<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="800" viewBox="0 0 1450 800" role="img" aria-labelledby="title">
<title id="title">Safe Point in the Scheduler Selection Path</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263746"/></marker>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d6f9f"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#357b73"/></marker>
<marker id="amber-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a96f1f"/></marker>
</defs>
<style>text{font-family:Arial,"Liberation Sans",sans-serif}.hair{stroke:#d4dbe0;stroke-width:1}</style>
<text x="56" y="55" font-size="25" fill="#263746" font-weight="700" text-anchor="start">Safe Point in the Scheduler Selection Path</text>
<line x1="56" y1="82" x2="1444" y2="82" class="hair"/>
<text x="145" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">Agent runtime</text>
<line x1="145" y1="137" x2="145" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="370" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">Event adapter</text>
<line x1="370" y1="137" x2="370" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="590" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">Predictor process</text>
<line x1="590" y1="137" x2="590" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="865" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">Scheduler main</text>
<line x1="865" y1="137" x2="865" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="1110" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">SGLang allocator</text>
<line x1="1110" y1="137" x2="1110" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="1320" y="120" font-size="10" fill="#263746" font-weight="650" text-anchor="middle">DMA worker</text>
<line x1="1320" y1="137" x2="1320" y2="713" stroke="#d4dbe0" stroke-width="1" stroke-dasharray="3 4"/>
<text x="56" y="163" font-size="9" fill="#687680" font-weight="600" text-anchor="start">event</text>
<line x1="145" y1="176" x2="365" y2="176" stroke="#357b73" stroke-width="1.5" marker-end="url(#teal-arrow)"/>
<text x="253" y="168" font-size="9" fill="#357b73" font-weight="550" text-anchor="middle">TOOL / SPAWN / RETURN</text>
<text x="56" y="224" font-size="9" fill="#687680" font-weight="600" text-anchor="start">snapshot</text>
<line x1="865" y1="235" x2="375" y2="235" stroke="#3d6f9f" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#blue-arrow)"/>
<text x="618" y="227" font-size="9" fill="#3d6f9f" font-weight="500" text-anchor="middle">compact causal + demand delta</text>
<line x1="370" y1="248" x2="585" y2="248" stroke="#3d6f9f" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#blue-arrow)"/>
<text x="478" y="264" font-size="8.5" fill="#687680" font-weight="450" text-anchor="middle">capacity-one latest-wins</text>
<rect x="513" y="286" width="154" height="61" rx="2" fill="#edf3f8" stroke="#3d6f9f" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="590" y="311" font-size="10" fill="#3d6f9f" font-weight="650" text-anchor="middle">infer</text>
<text x="590" y="329" font-size="8.5" fill="#687680" font-weight="450" text-anchor="middle">no live scheduler access</text>
<line x1="590" y1="347" x2="590" y2="383" stroke="#3d6f9f" stroke-width="1.3" stroke-dasharray="5 3"/>
<rect x="531" y="384" width="118" height="32" rx="2" fill="#ffffff" stroke="#3d6f9f" stroke-width="1" stroke-dasharray="5 3"/>
<text x="590" y="405" font-size="9" fill="#3d6f9f" font-weight="550" text-anchor="middle">result mailbox</text>
<path d="M649 400 L865 400" fill="none" stroke="#3d6f9f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#blue-arrow)"/>
<text x="755" y="391" font-size="8.5" fill="#3d6f9f" font-weight="500" text-anchor="middle">fd wakeup</text>
<text x="56" y="308" font-size="9" fill="#687680" font-weight="600" text-anchor="start">selection</text>
<rect x="772" y="278" width="187" height="169" rx="2" fill="#fbfcfd" stroke="#a96f1f" stroke-width="1.4"/>
<text x="865" y="301" font-size="10" fill="#a96f1f" font-weight="650" text-anchor="middle">synchronous safe point</text>
<circle cx="800" cy="326" r="8" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1"/>
<text x="800" y="329" font-size="8" fill="#a96f1f" font-weight="700" text-anchor="middle">1</text>
<text x="817" y="329" font-size="8.8" fill="#263746" font-weight="500" text-anchor="start">drain bounded events</text>
<circle cx="800" cy="353" r="8" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1"/>
<text x="800" y="356" font-size="8" fill="#a96f1f" font-weight="700" text-anchor="middle">2</text>
<text x="817" y="356" font-size="8.8" fill="#263746" font-weight="500" text-anchor="start">poll latest result</text>
<circle cx="800" cy="380" r="8" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1"/>
<text x="800" y="383" font-size="8" fill="#a96f1f" font-weight="700" text-anchor="middle">3</text>
<text x="817" y="383" font-size="8.8" fill="#263746" font-weight="500" text-anchor="start">rebind ID / epoch</text>
<circle cx="800" cy="407" r="8" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1"/>
<text x="800" y="410" font-size="8" fill="#a96f1f" font-weight="700" text-anchor="middle">4</text>
<text x="817" y="410" font-size="8.8" fill="#263746" font-weight="500" text-anchor="start">check live state</text>
<text x="865" y="437" font-size="8.5" fill="#687680" font-weight="450" text-anchor="middle">inside batch selection</text>
<text x="56" y="494" font-size="9" fill="#687680" font-weight="600" text-anchor="start">native call</text>
<line x1="959" y1="506" x2="1105" y2="506" stroke="#263746" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1032" y="498" font-size="8.5" fill="#263746" font-weight="500" text-anchor="middle">admit / skip</text>
<text x="56" y="553" font-size="9" fill="#687680" font-weight="600" text-anchor="start">transfer</text>
<line x1="1110" y1="565" x2="1315" y2="565" stroke="#3d6f9f" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
<text x="1212" y="557" font-size="8.5" fill="#3d6f9f" font-weight="500" text-anchor="middle">native async DMA</text>
<line x1="1320" y1="591" x2="1115" y2="591" stroke="#357b73" stroke-width="1.5" marker-end="url(#teal-arrow)"/>
<text x="1216" y="608" font-size="8.5" fill="#357b73" font-weight="500" text-anchor="middle">ACK / capacity result</text>
<path d="M1110 591 L1110 650 L865 650" fill="none" stroke="#357b73" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#teal-arrow)"/>
<text x="987" y="643" font-size="8.5" fill="#357b73" font-weight="500" text-anchor="middle">receipt updates mirror</text>
<line x1="56" y1="688" x2="1394" y2="688" stroke="#d4dbe0" stroke-width="1"/>
<text x="56" y="721" font-size="10" fill="#687680" font-weight="500" text-anchor="start">Safe point runs when the scheduler selects a batch; it is not a separate periodic thread.</text>
<text x="56" y="742" font-size="10" fill="#687680" font-weight="500" text-anchor="start">Predictor latency never blocks this path; SGLang remains the physical admission authority.</text>
</svg>
