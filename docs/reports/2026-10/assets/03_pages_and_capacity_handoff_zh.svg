<text x="40" y="49" font-size="31" fill="#263746" font-weight="700" text-anchor="start">增量迁移与 Child → Parent 容量交接</text>
<text x="40" y="82" font-size="22" fill="#687680" font-weight="400" text-anchor="start">Agent 语义选择受益对象，原生页决定实际迁移范围</text>
