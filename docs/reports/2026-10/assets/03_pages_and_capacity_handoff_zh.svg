<text x="355" y="375" font-size="21" fill="#687680" font-weight="400" text-anchor="middle">已有有效副本：跳过</text>
<text x="610" y="375" font-size="20" fill="#357b73" font-weight="400" text-anchor="middle">仅复制缺失段</text>
<text x="62" y="407" font-size="21" fill="#263746" font-weight="400" text-anchor="start">PREPARE_HOST 仅备份缺失 FULL；备份本身不释放 HBM。</text>
<rect x="830" y="123" width="570" height="298" rx="3" fill="#ffffff" stroke="#d4dbe0" stroke-width="1.7"/>
<line x1="831" y1="124" x2="1399" y2="124" stroke="#a96f1f" stroke-width="3"/>
<text x="852" y="163" font-size="26" fill="#a96f1f" font-weight="700" text-anchor="start">(b) 必要 Mamba checkpoint</text>
<rect x="868" y="206" width="130" height="68" rx="2" fill="#f2f4f5" stroke="#89959d" stroke-width="1.3"/>
<text x="933.0" y="248.5" font-size="25" fill="#263746" font-weight="600" text-anchor="middle">s0</text>
<rect x="1035" y="206" width="130" height="68" rx="2" fill="#f2f4f5" stroke="#89959d" stroke-width="1.3"/>
<text x="1100.0" y="248.5" font-size="25" fill="#263746" font-weight="600" text-anchor="middle">s1</text>
<rect x="1202" y="206" width="130" height="68" rx="2" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1.3"/>
<text x="1267.0" y="248.5" font-size="25" fill="#263746" font-weight="600" text-anchor="middle">s2</text>
<path d="M1001 240 L1033 240" fill="none" stroke="#687680" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1168 240 L1200 240" fill="none" stroke="#a96f1f" stroke-width="2.4" marker-end="url(#amber-arrow)"/>
<text x="1098" y="311" font-size="22" fill="#a96f1f" font-weight="400" text-anchor="middle">选择目标 checkpoint 所需状态</text>
<text x="852" y="355" font-size="22" fill="#263746" font-weight="400" text-anchor="start">PREPARE_HOST 不投机备份 Mamba。</text>
<text x="852" y="388" font-size="22" fill="#263746" font-weight="400" text-anchor="start">其他有效状态仍由原生缓存管理。</text>
<rect x="40" y="464" width="1360" height="440" rx="3" fill="#ffffff" stroke="#d4dbe0" stroke-width="1.7"/>
<line x1="41" y1="465" x2="1399" y2="465" stroke="#3d6f9f" stroke-width="3"/>
<text x="62" y="504" font-size="26" fill="#3d6f9f" font-weight="700" text-anchor="start">(c) 协同 Child 回收、Parent 恢复与准入</text>
<circle cx="117" cy="599" r="25" fill="#edf3f8" stroke="#3d6f9f" stroke-width="1.4"/>
<text x="117" y="607.75" font-size="25" fill="#263746" font-weight="700" text-anchor="middle">P</text>
<circle cx="263" cy="568" r="26" fill="#eaf3f1" stroke="#357b73" stroke-width="1.4"/>
<text x="263" y="575.7" font-size="22" fill="#263746" font-weight="700" text-anchor="middle">C1</text>
<circle cx="263" cy="652" r="26" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1.4"/>
<text x="263" y="659.7" font-size="22" fill="#263746" font-weight="700" text-anchor="middle">C2</text>
<path d="M142 590 L235 566" fill="none" stroke="#3d6f9f" stroke-width="2.4" marker-end="url(#blue-arrow)"/>
<path d="M142 610 L235 646" fill="none" stroke="#3d6f9f" stroke-width="2.4" marker-end="url(#blue-arrow)"/>
<text x="114" y="652" font-size="18" fill="#687680" font-weight="400" text-anchor="middle">WAIT_JOIN</text>
<text x="261" y="531" font-size="18" fill="#357b73" font-weight="700" text-anchor="middle">RETURN</text>
<text x="265" y="704" font-size="19" fill="#a96f1f" font-weight="400" text-anchor="middle">仍在运行</text>
<path d="M291 568 L371 568" fill="none" stroke="#357b73" stroke-width="2.4" marker-end="url(#teal-arrow)"/>
<rect x="374" y="532" width="289" height="176" rx="2" fill="#eaf3f1" stroke="#357b73" stroke-width="1.8"/>
<text x="518" y="569" font-size="21" fill="#357b73" font-weight="700" text-anchor="middle">回收私有页</text>
<text x="395" y="610" font-size="19" fill="#263746" font-weight="400" text-anchor="start">无活跃或共享引用</text>
<text x="395" y="643" font-size="19" fill="#263746" font-weight="400" text-anchor="start">无在途传输依赖</text>
<text x="395" y="676" font-size="19" fill="#263746" font-weight="400" text-anchor="start">保留共享前缀</text>
<path d="M664 620 L721 620" fill="none" stroke="#357b73" stroke-width="2.4" marker-end="url(#teal-arrow)"/>
<rect x="723" y="532" width="267" height="176" rx="2" fill="#f2f4f5" stroke="#89959d" stroke-width="1.8"/>
<text x="856" y="570" font-size="23" fill="#263746" font-weight="700" text-anchor="middle">原生空闲列表</text>
<rect x="746" y="598" width="221" height="39" rx="2" fill="#ffffff" stroke="#3d6f9f" stroke-width="1.3"/>
<text x="856.5" y="624.64" font-size="21" fill="#263746" font-weight="600" text-anchor="middle">FULL 页</text>
<rect x="746" y="650" width="221" height="39" rx="2" fill="#ffffff" stroke="#a96f1f" stroke-width="1.3"/>
<text x="856.5" y="676.64" font-size="21" fill="#263746" font-weight="600" text-anchor="middle">Mamba 槽位</text>
<path d="M991 620 L1046 620" fill="none" stroke="#3d6f9f" stroke-width="2.4" marker-end="url(#blue-arrow)"/>
<rect x="1048" y="532" width="324" height="176" rx="2" fill="#edf3f8" stroke="#3d6f9f" stroke-width="1.8"/>
<text x="1210" y="570" font-size="21" fill="#3d6f9f" font-weight="700" text-anchor="middle">Parent 恢复与执行</text>
<text x="1070" y="610" font-size="19" fill="#263746" font-weight="400" text-anchor="start">加载缺失 checkpoint 页</text>
<text x="1070" y="643" font-size="19" fill="#263746" font-weight="400" text-anchor="start">预留输入与 decode 增长</text>
<text x="1070" y="676" font-size="19" fill="#263746" font-weight="400" text-anchor="start">有界恢复感知准入</text>
<line x1="124" y1="747" x2="1366" y2="747" stroke="#d4dbe0" stroke-width="1.3"/>
<text x="65" y="794" font-size="22" fill="#357b73" font-weight="600" text-anchor="start">较早结束的 Child</text>
<text x="65" y="843" font-size="22" fill="#a96f1f" font-weight="600" text-anchor="start">最后一个 Child</text>
<circle cx="348" cy="785" r="5" fill="#357b73" stroke="#357b73" stroke-width="1"/>
<text x="368" y="794" font-size="21" fill="#357b73" font-weight="400" text-anchor="start">RETURN → 释放容量</text>
<rect x="700" y="764" width="359" height="41" rx="2" fill="#eaf3f1" stroke="#357b73" stroke-width="1.6"/>
<text x="879" y="792" font-size="21" fill="#357b73" font-weight="400" text-anchor="middle">Parent 预测性 H2D</text>
<rect x="349" y="817" width="791" height="39" rx="2" fill="#fbf2e3" stroke="#a96f1f" stroke-width="1.6"/>
<text x="744" y="844" font-size="21" fill="#a96f1f" font-weight="400" text-anchor="middle">最后生成仍在继续</text>
<line x1="1141" y1="755" x2="1141" y2="870" stroke="#89959d" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1156" y="841" font-size="19" fill="#263746" font-weight="600" text-anchor="start">RETURN</text>
<text x="40" y="952" font-size="22" fill="#263746" font-weight="400" text-anchor="start">较早结束的 sibling 可支持 RETURN 前预取；最后一个 child 的容量只能在结束后使用。</text>
<text x="40" y="983" font-size="22" fill="#263746" font-weight="400" text-anchor="start">回收容量通过原生分配器使用；共享页与仍在执行的页面保留。</text>
</svg>
