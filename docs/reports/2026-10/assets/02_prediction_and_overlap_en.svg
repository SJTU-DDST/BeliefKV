<text x="391" y="563" font-size="20" fill="#687680" font-weight="400" text-anchor="start">Valid missing Host pages</text>
<text x="732" y="531" font-size="23" fill="#357b73" font-weight="600" text-anchor="start">Capacity and cost</text>
